# Deploys web/ to GitHub Pages.
# Pages needs a public repo on GitHub Free. Once the repo is public:
#   1. Settings -> Pages -> Source: GitHub Actions
#   2. Uncomment the push trigger below.
name: Deploy demo to Pages

on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths: ["web/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
