# Publishes web/ (scoring form + agent replay) to GitHub Pages:
#   https://tmazzga.github.io/vessel-risk-agent/
#
# One-time setup (repo owner):
#   1. Settings -> Pages -> Build and deployment -> Source: GitHub Actions
#   2. A private repo needs GitHub Pro (free with the GitHub Student Developer Pack);
#      otherwise make the repo public first. The published site is public either way.
# After that, every merge to main that touches web/ redeploys automatically.
name: Deploy demo to Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/deploy.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
